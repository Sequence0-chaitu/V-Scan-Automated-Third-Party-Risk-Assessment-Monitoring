<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V-Scan — Risk Assessment Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  /* ── Reset & Base ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #05080f;
    --surface:   #0c1220;
    --border:    #1a2540;
    --accent:    #00e5ff;
    --accent2:   #7b2fff;
    --green:     #00ff88;
    --yellow:    #ffd600;
    --orange:    #ff7300;
    --red:       #ff2d55;
    --text:      #e8edf7;
    --muted:     #4a5878;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Noise texture overlay ────────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  /* ── Grid background ──────────────────────────────────────── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Layout ───────────────────────────────────────────────── */
  .layout { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 24px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .logo-text {
    font-family: var(--font-head);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,229,255,0.4);
  }

  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.8); }
  }

  /* ── Section: URL Scanner ─────────────────────────────────── */
  .scan-section {
    margin: 40px 0;
    padding: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .scan-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .section-label {
    font-family: var(--font-head);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .section-title {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 24px;
  }

  /* URL input row */
  .scan-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
    margin-bottom: 16px;
  }

  .url-input-wrap {
    flex: 1;
    position: relative;
  }

  .url-prefix {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 12px;
    pointer-events: none;
    user-select: none;
  }

  .url-input {
    width: 100%;
    padding: 14px 14px 14px 80px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .url-input::placeholder { color: var(--muted); }

  .url-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,229,255,0.1), inset 0 0 20px rgba(0,229,255,0.03);
  }

  .scan-btn {
    padding: 14px 32px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    font-family: var(--font-head);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .scan-btn:hover:not(:disabled) {
    background: #33ecff;
    box-shadow: 0 0 20px rgba(0,229,255,0.4);
  }

  .scan-btn:active:not(:disabled) { transform: translateY(1px); }

  .scan-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Questionnaire toggle */
  .q-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    user-select: none;
    width: fit-content;
    transition: color 0.2s;
  }
  .q-toggle:hover { color: var(--accent); }

  .q-toggle input[type="checkbox"] {
    width: 14px; height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Questionnaire grid */
  .q-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .q-grid.visible { display: grid; }

  .q-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .q-item:hover { border-color: var(--muted); }
  .q-item.checked { border-color: var(--accent); background: rgba(0,229,255,0.04); }

  .q-item label {
    font-size: 11px;
    color: var(--text);
    cursor: pointer;
    flex: 1;
    text-transform: capitalize;
  }

  .q-toggle-switch {
    position: relative;
    width: 32px;
    height: 18px;
    flex-shrink: 0;
  }

  .q-toggle-switch input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 18px;
    transition: background 0.2s;
    cursor: pointer;
  }

  .slider::before {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    left: 3px; top: 3px;
    background: var(--muted);
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }

  .q-toggle-switch input:checked + .slider { background: rgba(0,229,255,0.2); }
  .q-toggle-switch input:checked + .slider::before {
    transform: translateX(14px);
    background: var(--accent);
  }

  /* ── Scan Progress ────────────────────────────────────────── */
  .scan-progress {
    display: none;
    margin-top: 24px;
    padding: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  .scan-progress.active { display: block; }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .progress-label { color: var(--accent); font-size: 11px; letter-spacing: 2px; }
  .progress-url { color: var(--muted); font-size: 11px; }

  .progress-bar-wrap {
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    width: 0%;
    transition: width 0.4s ease;
    animation: shimmer 1.5s infinite;
  }

  @keyframes shimmer {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.4); }
    100% { filter: brightness(1); }
  }

  .progress-steps {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .progress-step {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: center;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 0.3s, transform 0.3s;
  }

  .progress-step.done { opacity: 1; transform: translateX(0); color: var(--text); }
  .progress-step.done .step-icon { color: var(--green); }
  .progress-step.active { opacity: 1; transform: translateX(0); }
  .progress-step.active .step-icon { color: var(--accent); animation: blink 0.8s infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── Scan Result ──────────────────────────────────────────── */
  .scan-result {
    display: none;
    margin-top: 24px;
    animation: fadeUp 0.4s ease;
  }

  .scan-result.visible { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 16px;
  }

  .score-circle {
    position: relative;
    width: 90px;
    height: 90px;
    flex-shrink: 0;
  }

  .score-circle svg { transform: rotate(-90deg); }

  .score-circle-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .score-number {
    font-family: var(--font-head);
    font-size: 24px;
    font-weight: 800;
    line-height: 1;
  }

  .score-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .result-info { flex: 1; }

  .result-url {
    font-size: 15px;
    color: var(--text);
    font-family: var(--font-head);
    font-weight: 600;
    margin-bottom: 6px;
    word-break: break-all;
  }

  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 2px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .risk-LOW    { background: rgba(0,255,136,0.1);  color: var(--green);  border: 1px solid rgba(0,255,136,0.3); }
  .risk-MEDIUM { background: rgba(255,214,0,0.1);  color: var(--yellow); border: 1px solid rgba(255,214,0,0.3); }
  .risk-HIGH   { background: rgba(255,115,0,0.1);  color: var(--orange); border: 1px solid rgba(255,115,0,0.3); }
  .risk-CRITICAL { background: rgba(255,45,85,0.1); color: var(--red); border: 1px solid rgba(255,45,85,0.3); }

  .result-meta { font-size: 11px; color: var(--muted); }

  /* Checks table */
  .checks-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  @media (max-width: 700px) { .checks-grid { grid-template-columns: 1fr; } }

  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 11px;
    transition: border-color 0.2s;
  }

  .check-row:hover { border-color: var(--muted); }

  .check-status {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }

  .check-status.pass { background: rgba(0,255,136,0.15); color: var(--green); }
  .check-status.fail { background: rgba(255,45,85,0.15);  color: var(--red); }

  .check-name { flex: 1; color: var(--text); }
  .check-controls { color: var(--muted); font-size: 10px; }

  /* ── History Section ──────────────────────────────────────── */
  .history-section { margin: 40px 0 60px; }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .refresh-btn {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    letter-spacing: 1px;
  }

  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  .history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .history-table th {
    text-align: left;
    padding: 10px 14px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    font-weight: 400;
  }

  .history-table td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(26,37,64,0.5);
    vertical-align: middle;
    color: var(--text);
  }

  .history-table tr:hover td { background: rgba(255,255,255,0.02); }

  .score-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 22px;
    border-radius: 2px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-head);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }
  .empty-text { font-size: 12px; line-height: 1.8; }

  /* ── Error toast ──────────────────────────────────────────── */
  .toast {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 14px 20px;
    background: var(--surface);
    border: 1px solid var(--red);
    border-radius: 3px;
    color: var(--red);
    font-size: 12px;
    max-width: 360px;
    z-index: 100;
    animation: slideIn 0.3s ease;
  }

  .toast.visible { display: block; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── Responsive ───────────────────────────────────────────── */
  @media (max-width: 600px) {
    .scan-row { flex-direction: column; }
    .result-header { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Header -->
  <header>
    <div class="logo">
      <span class="logo-text">V-SCAN</span>
      <span class="logo-sub">Third-Party Risk Assessment</span>
    </div>
    <div class="header-status">
      <div class="pulse"></div>
      <span id="statusText">SYSTEM ONLINE</span>
    </div>
  </header>

  <!-- ── URL Scanner Section ── -->
  <section class="scan-section">
    <div class="section-label">New Assessment</div>
    <div class="section-title">Scan a Vendor URL</div>

    <div class="scan-row">
      <div class="url-input-wrap">
        <span class="url-prefix">https://</span>
        <input
          id="urlInput"
          class="url-input"
          type="text"
          placeholder="example.com"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button id="scanBtn" class="scan-btn" onclick="startScan()">
        RUN SCAN
      </button>
    </div>

    <!-- Questionnaire toggle -->
    <label class="q-toggle">
      <input type="checkbox" id="qToggle" onchange="toggleQuestionnaire()" />
      CONFIGURE QUESTIONNAIRE ANSWERS
    </label>

    <div id="qGrid" class="q-grid">
      <!-- Populated by JS -->
    </div>

    <!-- Progress indicator -->
    <div id="scanProgress" class="scan-progress">
      <div class="progress-header">
        <span class="progress-label">SCANNING</span>
        <span class="progress-url" id="progressUrl"></span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-steps" id="progressSteps"></div>
    </div>

    <!-- Scan result -->
    <div id="scanResult" class="scan-result"></div>
  </section>

  <!-- ── Scan History Section ── -->
  <section class="history-section">
    <div class="section-header">
      <div>
        <div class="section-label">History</div>
        <div class="section-title" style="font-size:18px;margin-bottom:0">Recent Scans</div>
      </div>
      <button class="refresh-btn" onclick="loadHistory()">↻ REFRESH</button>
    </div>
    <div id="historyContainer">
      <div class="empty-state">
        <div class="empty-icon">◌</div>
        <div class="empty-text">Loading scan history…</div>
      </div>
    </div>
  </section>

</div>

<!-- Error toast -->
<div id="toast" class="toast"></div>

<script>
// ── Constants ────────────────────────────────────────────────
const Q_KEYS = [
  "encryption_at_rest",
  "encryption_in_transit",
  "access_control_policy",
  "mfa_enforced",
  "patch_management",
  "incident_response_plan",
  "security_awareness",
  "vendor_risk_program",
  "data_classification",
  "backup_restore_tested",
  "penetration_testing"
];

const SCAN_STEPS = [
  "Resolving DNS & connecting…",
  "Fetching HTTP headers…",
  "Checking security headers (HSTS, CSP, X-Frame…)",
  "Validating SSL/TLS certificate…",
  "Checking TLS version & expiry…",
  "Processing questionnaire answers…",
  "Calculating risk score…",
  "Persisting to database…"
];

const RISK_COLORS = {
  LOW: '#00ff88', MEDIUM: '#ffd600', HIGH: '#ff7300', CRITICAL: '#ff2d55'
};

let questionnaireValues = {};

// ── Init ─────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildQuestionnaire();
  loadHistory();
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startScan();
  });
});

// ── Questionnaire builder ────────────────────────────────────
function buildQuestionnaire() {
  const grid = document.getElementById('qGrid');
  Q_KEYS.forEach(key => {
    questionnaireValues[key] = false;
    const label = key.replace(/_/g, ' ');
    const item = document.createElement('div');
    item.className = 'q-item';
    item.id = `qi-${key}`;
    item.innerHTML = `
      <label for="q-${key}">${label}</label>
      <label class="q-toggle-switch">
        <input type="checkbox" id="q-${key}" onchange="updateQ('${key}', this.checked)" />
        <span class="slider"></span>
      </label>`;
    grid.appendChild(item);
  });
}

function updateQ(key, val) {
  questionnaireValues[key] = val;
  document.getElementById(`qi-${key}`).classList.toggle('checked', val);
}

function toggleQuestionnaire() {
  document.getElementById('qGrid').classList.toggle('visible',
    document.getElementById('qToggle').checked);
}

// ── Scan logic ───────────────────────────────────────────────
async function startScan() {
  let url = document.getElementById('urlInput').value.trim();
  if (!url) { showToast('Please enter a URL to scan.'); return; }
  if (!url.startsWith('http')) url = 'https://' + url;

  // UI state
  document.getElementById('scanBtn').disabled = true;
  document.getElementById('scanResult').classList.remove('visible');
  document.getElementById('scanResult').innerHTML = '';

  showProgress(url);

  try {
    const body = { url, questionnaire: { ...questionnaireValues } };
    const res = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    finishProgress();

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    renderResult(data);
    loadHistory();

  } catch (err) {
    hideProgress();
    showToast(`Scan failed: ${err.message}`);
  } finally {
    document.getElementById('scanBtn').disabled = false;
  }
}

// ── Progress animation ───────────────────────────────────────
let progressInterval;
let stepIndex = 0;

function showProgress(url) {
  stepIndex = 0;
  const prog = document.getElementById('scanProgress');
  document.getElementById('progressUrl').textContent = url;
  document.getElementById('progressBar').style.width = '0%';

  const stepsEl = document.getElementById('progressSteps');
  stepsEl.innerHTML = SCAN_STEPS.map((s, i) =>
    `<div class="progress-step" id="pstep-${i}"><span class="step-icon">▸</span>${s}</div>`
  ).join('');

  prog.classList.add('active');

  const totalMs = 3000;
  const stepMs  = totalMs / SCAN_STEPS.length;

  progressInterval = setInterval(() => {
    if (stepIndex > 0) {
      const prev = document.getElementById(`pstep-${stepIndex - 1}`);
      if (prev) { prev.classList.remove('active'); prev.classList.add('done'); prev.querySelector('.step-icon').textContent = '✓'; }
    }
    if (stepIndex < SCAN_STEPS.length) {
      const cur = document.getElementById(`pstep-${stepIndex}`);
      if (cur) cur.classList.add('active');
      document.getElementById('progressBar').style.width = `${((stepIndex + 1) / SCAN_STEPS.length) * 90}%`;
      stepIndex++;
    }
  }, stepMs);
}

function finishProgress() {
  clearInterval(progressInterval);
  document.getElementById('progressBar').style.width = '100%';
  SCAN_STEPS.forEach((_, i) => {
    const el = document.getElementById(`pstep-${i}`);
    if (el) { el.classList.remove('active'); el.classList.add('done'); el.querySelector('.step-icon').textContent = '✓'; }
  });
  setTimeout(hideProgress, 600);
}

function hideProgress() {
  clearInterval(progressInterval);
  document.getElementById('scanProgress').classList.remove('active');
}

// ── Render scan result ───────────────────────────────────────
function renderResult(data) {
  const color = RISK_COLORS[data.risk_level] || '#e8edf7';
  const passCount = data.breakdown.filter(c => c.passed).length;
  const total = data.breakdown.length;
  const pct = (data.score / 100) * 283; // circumference ~283

  const resultEl = document.getElementById('scanResult');
  resultEl.innerHTML = `
    <div class="result-header">
      <div class="score-circle">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="38" fill="none" stroke="#1a2540" stroke-width="6"/>
          <circle cx="45" cy="45" r="38" fill="none" stroke="${color}"
            stroke-width="6" stroke-linecap="round"
            stroke-dasharray="${pct} 283"
            style="filter: drop-shadow(0 0 6px ${color}66)"/>
        </svg>
        <div class="score-circle-text">
          <span class="score-number" style="color:${color}">${data.score}</span>
          <span class="score-label">/ 100</span>
        </div>
      </div>
      <div class="result-info">
        <div class="result-url">${escapeHtml(data.url)}</div>
        <div class="risk-badge risk-${data.risk_level}">
          <span>●</span> ${data.risk_level} RISK
        </div>
        <div class="result-meta">Scan #${data.scan_id} · ${passCount}/${total} checks passed</div>
      </div>
    </div>

    <div class="checks-grid">
      ${data.breakdown.map(c => `
        <div class="check-row">
          <div class="check-status ${c.passed ? 'pass' : 'fail'}">${c.passed ? '✓' : '✗'}</div>
          <div class="check-name">${escapeHtml(c.name)}</div>
          <div class="check-controls">${c.iso || '—'} · ${c.nist || '—'}</div>
        </div>
      `).join('')}
    </div>
  `;

  resultEl.classList.add('visible');
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── History ──────────────────────────────────────────────────
async function loadHistory() {
  try {
    const res = await fetch('/api/scans?limit=20');
    if (!res.ok) throw new Error('Failed to load history');
    const { scans } = await res.json();
    renderHistory(scans);
  } catch (err) {
    document.getElementById('historyContainer').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠</div>
        <div class="empty-text">Could not load history.<br/>Is the API server running?</div>
      </div>`;
  }
}

function renderHistory(scans) {
  const container = document.getElementById('historyContainer');
  if (!scans || scans.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">◌</div>
        <div class="empty-text">No scans yet.<br/>Run your first assessment above.</div>
      </div>`;
    return;
  }

  container.innerHTML = `
    <table class="history-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Vendor URL</th>
          <th>Risk Level</th>
          <th>Score</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
        ${scans.map(s => {
          const color = RISK_COLORS[s.risk_level] || '#e8edf7';
          const dt = new Date(s.timestamp * 1000).toLocaleString();
          return `
          <tr>
            <td style="color:var(--muted)">${s.id}</td>
            <td style="font-size:12px">${escapeHtml(s.vendor_url)}</td>
            <td><span class="risk-badge risk-${s.risk_level}" style="padding:3px 8px;font-size:10px">${s.risk_level}</span></td>
            <td><span class="score-pill" style="background:${color}22;color:${color};border:1px solid ${color}44">${s.score.toFixed(0)}</span></td>
            <td style="color:var(--muted);font-size:11px">${dt}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// ── Utils ────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 4000);
}
</script>
</body>
</html>
